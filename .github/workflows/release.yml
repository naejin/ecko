name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: ecko-linux-x86_64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: ecko-linux-aarch64
            ext: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: ecko-macos-x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: ecko-macos-aarch64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: ecko-windows-x86_64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Sync plugin.json version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import json, sys
          p = '.claude-plugin/plugin.json'
          d = json.load(open(p))
          d['version'] = sys.argv[1]
          json.dump(d, open(p, 'w'), indent=2)
          " "$VERSION"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (Unix)
        if: matrix.ext == 'tar.gz'
        run: |
          mkdir -p staging/ecko/target/release
          cp target/${{ matrix.target }}/release/ecko staging/ecko/target/release/
          cp -r .claude-plugin staging/ecko/
          cp -r commands staging/ecko/
          cp -r hooks staging/ecko/
          mkdir -p staging/ecko/scripts
          cp scripts/run.sh staging/ecko/scripts/
          cp scripts/run.cmd staging/ecko/scripts/
          chmod +x staging/ecko/scripts/run.sh
          chmod +x staging/ecko/target/release/ecko
          chmod +x staging/ecko/hooks/*.sh
          cd staging
          tar czf ../${{ matrix.artifact }}.${{ matrix.ext }} ecko
        shell: bash

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        run: |
          mkdir -p staging/ecko/target/release
          cp target/${{ matrix.target }}/release/ecko.exe staging/ecko/target/release/
          # Update plugin.json to use run.cmd for Windows
          python3 -c "
          import json
          p = '.claude-plugin/plugin.json'
          d = json.load(open(p))
          d['mcpServers']['ecko']['command'] = '\${CLAUDE_PLUGIN_ROOT}/scripts/run.cmd'
          json.dump(d, open(p, 'w'), indent=2)
          "
          cp -r .claude-plugin staging/ecko/
          cp -r commands staging/ecko/
          cp -r hooks staging/ecko/
          mkdir -p staging/ecko/scripts
          cp scripts/run.sh staging/ecko/scripts/
          cp scripts/run.cmd staging/ecko/scripts/
          cd staging
          7z a -tzip ../${{ matrix.artifact }}.${{ matrix.ext }} ecko
        shell: bash

      - name: Smoke test binary
        if: "!matrix.cross"
        run: |
          if [ "${{ matrix.ext }}" = "zip" ]; then
            BIN="target/${{ matrix.target }}/release/ecko.exe"
          else
            BIN="target/${{ matrix.target }}/release/ecko"
          fi
          VERSION="${GITHUB_REF_NAME#v}"

          # --version check
          BIN_VERSION=$("$BIN" --version 2>&1)
          if echo "$BIN_VERSION" | grep -q "$VERSION"; then
            echo "Binary reports v${VERSION}"
          else
            echo "Binary version '${BIN_VERSION}' doesn't match tag ${VERSION}"
            exit 1
          fi

          # MCP initialize + tools/list
          RESP=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-test","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$BIN" --mode mcp-server 2>/dev/null || true)

          TOOL_COUNT=$(echo "$RESP" | python3 -c "
          import sys, json
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              try:
                  d = json.loads(line)
                  if d.get('id') == 2 and 'result' in d:
                      tools = d['result']['tools']
                      names = sorted(t['name'] for t in tools)
                      expected = ['ecko_check_file', 'ecko_check_workspace', 'ecko_dry_run', 'ecko_explain', 'ecko_status']
                      for e in expected:
                          if e not in names:
                              print(f'missing tool: {e}', file=sys.stderr)
                              sys.exit(1)
                      print(len(tools))
              except: pass
          " 2>&1 || true)

          if [ "$TOOL_COUNT" = "5" ]; then
            echo "All 5 MCP tools registered"
          else
            echo "Expected 5 MCP tools, got: ${TOOL_COUNT}"
            exit 1
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  validate:
    name: Validate artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate artifact contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ERRORS=0

          REQUIRED_FILES=(
            "ecko/.claude-plugin/plugin.json"
            "ecko/hooks/hooks.json"
            "ecko/hooks/post_tool_use.sh"
            "ecko/hooks/pre_tool_use_bash.sh"
            "ecko/hooks/stop_hook.sh"
            "ecko/hooks/exit_plan_mode.sh"
            "ecko/commands/ping.md"
            "ecko/commands/status.md"
            "ecko/commands/setup.md"
            "ecko/commands/reverb.md"
            "ecko/commands/tune.md"
            "ecko/commands/session.md"
            "ecko/scripts/run.sh"
            "ecko/scripts/run.cmd"
          )

          for dir in artifacts/ecko-*/; do
            ARCHIVE=$(find "$dir" -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -1)
            NAME=$(basename "$ARCHIVE")
            echo "-- Validating $NAME --"

            TMPDIR=$(mktemp -d)
            if [[ "$ARCHIVE" == *.tar.gz ]]; then
              tar xzf "$ARCHIVE" -C "$TMPDIR"
              BINARY="$TMPDIR/ecko/target/release/ecko"
            else
              unzip -q "$ARCHIVE" -d "$TMPDIR"
              BINARY="$TMPDIR/ecko/target/release/ecko.exe"
            fi

            # Check required files
            for f in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$TMPDIR/$f" ]; then
                echo "  MISSING: $f"
                ERRORS=$((ERRORS + 1))
              fi
            done

            # Check binary exists
            if [ ! -f "$BINARY" ]; then
              echo "  MISSING: binary"
              ERRORS=$((ERRORS + 1))
            else
              echo "  binary present"
            fi

            # Check plugin.json version matches tag
            PV=$(python3 -c "import json; print(json.load(open('$TMPDIR/ecko/.claude-plugin/plugin.json'))['version'])")
            if [ "$PV" = "$VERSION" ]; then
              echo "  plugin.json version matches tag (v${VERSION})"
            else
              echo "  plugin.json version '${PV}' != tag '${VERSION}'"
              ERRORS=$((ERRORS + 1))
            fi

            # Check no .mcp.json leaked in
            if [ -f "$TMPDIR/ecko/.claude-plugin/.mcp.json" ]; then
              echo "  .mcp.json should not be in release artifacts"
              ERRORS=$((ERRORS + 1))
            fi

            rm -rf "$TMPDIR"
            echo "  all required files present"
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "${ERRORS} validation error(s) -- aborting release"
            exit 1
          fi
          echo ""
          echo "All artifacts validated"
        shell: bash

  release:
    name: Create Release
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
